{% extends "monitoring/base.html" %}
{% block title %}Monitoring History – SMARTFLOOD{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <h2>Monitoring History</h2>
    <label class="muted">Show last
      <select id="limit-select">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="300">300</option>
        <option value="1000">1000</option>
      </select> readings</label>
  </div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <p id="chart-msg" class="muted" hidden></p>
</section>
<section class="panel">
  <h2>Reading Log</h2>
  <p id="empty-msg" class="muted" hidden>Waiting for ESP32 data.</p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Date &amp; time</th><th>Sensor value</th><th>Status</th><th></th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>
</section>
{% endblock %}
